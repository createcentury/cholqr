[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cholqr"
version = "0.5.1"
description = "Fast, compile-friendly shifted CholeskyQR3 for batched tall-skinny matrices in PyTorch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Soki Fukuda" }]
dependencies = ["torch>=2.1"]
keywords = ["qr", "cholesky", "randomized-svd", "muon", "pytorch", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/createcentury/cholqr"
Issues = "https://github.com/createcentury/cholqr/issues"
Changelog = "https://github.com/createcentury/cholqr/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cholqr"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["benchmarks", "docs", "lean", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# E741: `l` is the column count / Cholesky factor, following the notation of the paper and the Lean proof.
ignore = ["E741"]

[tool.mypy]
# 3.10, not 3.9: current torch sources use `match` (a 3.10 syntax error for mypy) and mypy >= 1.19 dropped 3.9.
# 3.9 syntax compatibility is covered by ruff (target-version py39) and the Python 3.9 test job.
python_version = "3.10"
files = ["src/cholqr"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true
