[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cholqr"
version = "0.5.1"
description = "Fast, compile-friendly shifted CholeskyQR3 for batched tall-skinny matrices in PyTorch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Soki Fukuda" }]
dependencies = ["torch>=2.1"]
keywords = ["qr", "cholesky", "randomized-svd", "muon", "pytorch", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/createcentury/cholqr"
Issues = "https://github.com/createcentury/cholqr/issues"
Changelog = "https://github.com/createcentury/cholqr/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cholqr"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff", "pyproject.toml"]
